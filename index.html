    /**

     */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      initContext() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.ctx = new AudioContextClass();
          }
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      }

      // Звук механического щелчка указателя при пересечении штырька сектора
      playTick(speedFactor = 1) {
        if (!this.enabled) return;
        this.initContext();
        if (!this.ctx) return;

        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          // Резонансный клик с резким затуханием (щелчок трещотки)
          osc.type = "triangle";
          const baseFreq = 850 + Math.random() * 200;
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(120, now + 0.025);

          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.028);
        } catch (e) {
          // Игнорируем ограничения автовоспроизведения браузера до первого клика
        }
      }

      // Торжественные фанфары при остановке рулетки на выпавшем секторе
      playWinSound(isJackpot = false) {
        if (!this.enabled) return;
        this.initContext();
        if (!this.ctx) return;

        try {
          const now = this.ctx.currentTime;
          // Гармонический победный аккорд (C5, E5, G5, C6)
          const notes = isJackpot 
            ? [523.25, 659.25, 783.99, 1046.50, 1318.51] // Мажорная пентатоника для ДЖЕКПОТА
            : [523.25, 659.25, 783.99, 1046.50];

          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = isJackpot ? "sawtooth" : "triangle";
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.setValueAtTime(0.16, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.09 + 0.9);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + 0.95);
          });
        } catch (e) {}
      }
    }

    const sound = new SoundEngine();

    /**
     * =========================================================================
     * 3. МАТЕМАТИКА И ФИЗИКА ВРАЩЕНИЯ CANVAS
     * =========================================================================
     */
    const canvas = document.getElementById("wheel-canvas");

    const pointerElem = document.getElementById("wheel-pointer");
    const resultBanner = document.getElementById("result-banner");
    const resultBadge = document.getElementById("result-badge");
    const resultTitle = document.getElementById("result-title");
    const resultSubtext = document.getElementById("result-subtext");
    const resultTimerBar = document.getElementById("result-timer-bar");

    // Поддержка четких Retina/4K дисплеев
    const CANVAS_SIZE = 560;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = CANVAS_SIZE * dpr;
    canvas.height = CANVAS_SIZE * dpr;
    canvas.style.width = CANVAS_SIZE + "px";
    canvas.style.height = CANVAS_SIZE + "px";
    ctx.scale(dpr, dpr);

    const CENTER = CANVAS_SIZE / 2;
    const RADIUS = (CANVAS_SIZE / 2) - 24; // Отступ для неонового свечения и заклепок

    // Текущее состояние вращения
    let currentRotation = 0;      // Текущий угол в радианах
    let isSpinning = false;
    let spinStartTime = 0;
    let startRotation = 0;
    let targetRotation = 0;
    let lastTickSector = -1;
    let bannerTimeoutId = null;

    /**
     * Функция замедления (Ease-Out Quartic):
     * Обеспечивает быстрый старт, долгое плавное торможение и драматичное
     * подкрадывание к победному сектору на последних секундах.
     */
    function easeOutQuart(t) {
      return 1 - Math.pow(1 - t, 4);
    }

    /**
     * Определение текущего сектора под указателем.
     * Стрелка находится строго сверху по центру:
     * Угол указателя = 270 градусов (3 * PI / 2 или -PI / 2).
     */
    const POINTER_ANGLE = 1.5 * Math.PI;

    function getSectorUnderPointer(rotationRad) {
      // Нормализуем разницу углов в диапазон [0, 2 * PI)
      const diff = (POINTER_ANGLE - rotationRad) % (2 * Math.PI);
      const positiveAngle = (diff + 2 * Math.PI) % (2 * Math.PI);
      const index = Math.floor(positiveAngle / ARC_SIZE) % TOTAL_SECTORS;
      return index;
    }

    /**
     * =========================================================================

     * =========================================================================
     */
    function drawWheel(rotation) {
      ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

      ctx.save();
      ctx.translate(CENTER, CENTER);
      ctx.rotate(rotation);

      // Внешний металлический/темный обод с неоновой подсветкой
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, RADIUS + 12, 0, 2 * Math.PI);
      ctx.fillStyle = "#0f172a";
      ctx.shadowColor = "#38bdf8";
      ctx.shadowBlur = 22;
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#38bdf8";
      ctx.stroke();
      ctx.restore();

      // Отрисовка 10 секторов
      for (let i = 0; i < TOTAL_SECTORS; i++) {
        const sector = SECTORS[i];
        const startAngle = i * ARC_SIZE;
        const endAngle = (i + 1) * ARC_SIZE;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, RADIUS, startAngle, endAngle);
        ctx.closePath();

        // Радиальный градиент сектора для объема
        const radGrad = ctx.createRadialGradient(0, 0, 40, 0, 0, RADIUS);
        radGrad.addColorStop(0, sector.color);
        radGrad.addColorStop(1, sector.colorDark);
        ctx.fillStyle = radGrad;
        ctx.fill();

        // Контрастная белая обводка сектора
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
        ctx.stroke();

        // Отрисовка текста сектора вдоль радиуса
        ctx.save();
        const midAngle = startAngle + ARC_SIZE / 2;
        ctx.rotate(midAngle);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";

        // Если это Джекпот — особый золотой эффект
        if (sector.type === "jackpot") {
          ctx.font = "900 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
          ctx.fillStyle = "#ffffff";
          ctx.shadowColor = "#fde047";
          ctx.shadowBlur = 12;
        } else {
          ctx.font = "bold 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
          ctx.fillStyle = "#ffffff";
          ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
          ctx.shadowBlur = 8;
        }

        // Позиционирование надписи
        ctx.fillText(sector.label, RADIUS - 28, 0);
        ctx.restore();

        ctx.restore();
      }

      // Внешние неоновые заклепки/пины по периметру обода (места щелчков)
      for (let i = 0; i < TOTAL_SECTORS; i++) {
        const pinAngle = i * ARC_SIZE;
        const pinX = Math.cos(pinAngle) * (RADIUS + 4);
        const pinY = Math.sin(pinAngle) * (RADIUS + 4);

        ctx.save();
        ctx.beginPath();
        ctx.arc(pinX, pinY, 5.5, 0, 2 * Math.PI);
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "#38bdf8";
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "#0f172a";
        ctx.stroke();
        ctx.restore();
      }

      // Центральная неоновая заглушка (Центр колеса)
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, 46, 0, 2 * Math.PI);
      const centerGrad = ctx.createRadialGradient(0, 0, 8, 0, 0, 46);
      centerGrad.addColorStop(0, "#1e293b");
      centerGrad.addColorStop(0.7, "#0f172a");
      centerGrad.addColorStop(1, "#334155");
      ctx.fillStyle = centerGrad;
      ctx.shadowColor = "#38bdf8";
      ctx.shadowBlur = 20;
      ctx.fill();
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = "#38bdf8";
      ctx.stroke();

      // Маленькая центральная жемчужина
      ctx.beginPath();
      ctx.arc(0, 0, 16, 0, 2 * Math.PI);
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "#ff0055";
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.restore();

      ctx.restore();
    }

    /**
     * =========================================================================
     * 5. ЗАПУСК ВРАЩЕНИЯ И ФИЗИЧЕСКИЙ ЦИКЛ
     * =========================================================================
     */
    function spinWheel(forcedTargetIndex = null, triggerInfo = null) {
      if (isSpinning) {
        console.log("Колесо уже вращается, команда поставлена в очередь или проигнорирована");
        return;
      }

      sound.initContext();

      // Скрываем прошлую плашку результата
      hideResultBanner();

      // Выбираем сектор остановки
      let targetIndex;
      if (forcedTargetIndex !== null && forcedTargetIndex >= 0 && forcedTargetIndex < TOTAL_SECTORS) {
        targetIndex = forcedTargetIndex;
      } else {
        targetIndex = Math.floor(Math.random() * TOTAL_SECTORS);
      }

      isSpinning = true;
      spinStartTime = performance.now();
      startRotation = currentRotation % (2 * Math.PI);

      // Число полных оборотов (5 - 8)
      const fullSpins = CONFIG.minFullSpins + Math.floor(Math.random() * (CONFIG.maxFullSpins - CONFIG.minFullSpins + 1));

      // Случайное небольшое смещение внутри сектора для реализма (но строго без заступа за границу!)
      // Допустимый разброс внутри 36 градусов — ±30% от центра сектора
      const innerJitter = (Math.random() - 0.5) * 0.6 * ARC_SIZE;
      const targetSectorCenter = (targetIndex + 0.5) * ARC_SIZE + innerJitter;

      /**
       * МАТЕМАТИЧЕСКАЯ ФОРМУЛА СОВПАДЕНИЯ:
       * Чтобы сектор targetIndex оказался точно под POINTER_ANGLE (270 градусов),
       * целевой угол колеса targetRotation должен удовлетворять условию:
       * (POINTER_ANGLE - targetRotation) % 2PI == targetSectorCenter.
       * Следовательно: targetRotation = POINTER_ANGLE - targetSectorCenter + fullSpins * 2PI.
       */
      const baseStopAngle = POINTER_ANGLE - targetSectorCenter;
      // Приводим к движению вперед относительно текущего угла startRotation
      let deltaAngle = (baseStopAngle - startRotation) % (2 * Math.PI);
      if (deltaAngle <= 0) {
        deltaAngle += 2 * Math.PI;
      }

      targetRotation = startRotation + deltaAngle + (fullSpins * 2 * Math.PI);

      lastTickSector = getSectorUnderPointer(startRotation);

      console.log(`[Рулетка] Запуск вращения. Выбран сектор #${targetIndex + 1}: "${SECTORS[targetIndex].label}"`);

      // Запуск цикла анимации
      requestAnimationFrame((timestamp) => animateSpin(timestamp, targetIndex, triggerInfo));
    }

    function animateSpin(timestamp, targetIndex, triggerInfo) {
      const elapsed = timestamp - spinStartTime;
      const progress = Math.min(elapsed / CONFIG.spinDurationMs, 1);
      const ease = easeOutQuart(progress);

      currentRotation = startRotation + (targetRotation - startRotation) * ease;

      // Проверяем смену сектора под указателем для звука трещотки и отклонения стрелки
      const currentSector = getSectorUnderPointer(currentRotation);
      if (currentSector !== lastTickSector) {
        lastTickSector = currentSector;
        // Звуковой щелчок
        sound.playTick();
        // Физическое отклонение стрелки указателя
        deflectPointer();
      }

      drawWheel(currentRotation);

      if (progress < 1) {
        requestAnimationFrame((ts) => animateSpin(ts, targetIndex, triggerInfo));
      } else {
        // Остановка вращения
        isSpinning = false;
        currentRotation = targetRotation;
        drawWheel(currentRotation);

        // Итоговая строгая проверка сектора
        const finalSectorIdx = getSectorUnderPointer(currentRotation);
        const winningSector = SECTORS[finalSectorIdx];

        // Звук победы / фанфар
        sound.playWinSound(winningSector.type === "jackpot");

        // Показ плашки результата на 5 секунд
        showResultBanner(winningSector, triggerInfo);
      }
    }

    // Небольшое физическое отклонение стрелки указателя при прохождении штырьков
    let pointerResetTimer = null;
    function deflectPointer() {
      pointerElem.style.transform = "translateX(-50%) rotate(-18deg)";
      clearTimeout(pointerResetTimer);
      pointerResetTimer = setTimeout(() => {
        pointerElem.style.transform = "translateX(-50%) rotate(0deg)";
      }, 70);
    }

    /**
     * =========================================================================
     * 6. ВСПЛЫВАЮЩАЯ ПЛАШКА РЕЗУЛЬТАТА (5 СЕКУНД)
     * =========================================================================
     */
    function showResultBanner(sector, triggerInfo = null) {
      if (bannerTimeoutId) {
        clearTimeout(bannerTimeoutId);
      }

      resultTitle.textContent = sector.label;
      resultSubtext.textContent = sector.subtext;

      // Стилизуем плашку под сектор
      resultBanner.style.borderColor = sector.glowColor;
      resultBanner.style.boxShadow = `0 0 35px ${sector.glowColor}88, inset 0 0 15px ${sector.glowColor}33`;
      resultBadge.style.color = sector.glowColor;
      resultBadge.style.borderColor = sector.glowColor;
      resultBadge.style.background = `${sector.glowColor}22`;

      if (triggerInfo && triggerInfo.sender) {
        resultBadge.textContent = `ПОДАРОК ОТ @${triggerInfo.sender}`;
      } else {
        resultBadge.textContent = sector.type === "jackpot" ? "🔥 СУПЕР ДЖЕКПОТ 🔥" : "ВЫПАЛ СЕКТОР";
      }

      // Анимация таймер-бара на 5 секунд
      resultTimerBar.style.transition = "none";
      resultTimerBar.style.width = "100%";
      resultBanner.classList.add("visible");

      setTimeout(() => {
        resultTimerBar.style.transition = "width 5s linear";
        resultTimerBar.style.width = "0%";
      }, 50);

      // Автоматическое скрытие через 5 секунд
      bannerTimeoutId = setTimeout(() => {
        hideResultBanner();
      }, 5000);
    }

    function hideResultBanner() {
      resultBanner.classList.remove("visible");
      if (bannerTimeoutId) {
        clearTimeout(bannerTimeoutId);
        bannerTimeoutId = null;
      }
    }

    /**
     * =========================================================================
     * 7. ИНТЕГРАЦИЯ С TIKFINITY WEBSOCKET (ws://localhost:21213/)
     * =========================================================================
     */
    const wsDot = document.getElementById("ws-status-dot");
    const wsText = document.getElementById("ws-status-text");
    let tfSocket = null;
    let tikFinitySocket = null;
    let reconnectInterval = null;

    function initTikFinityWebSocket() {
      const wsUrl = `ws://localhost:${CONFIG.wsPort || 21213}/`;

      try {
        tfSocket = new WebSocket(wsUrl);
        tikFinitySocket = tfSocket;
        window.tfSocket = tfSocket;

        tfSocket.onopen = () => {
          console.log("Подключено к TikFinity");
          if (wsDot) wsDot.classList.add("connected");
          if (wsText) wsText.textContent = `TikFinity: Подключен (: ${CONFIG.wsPort || 21213})`;
          if (reconnectInterval) {
            clearInterval(reconnectInterval);
            reconnectInterval = null;
          }
        };

        tfSocket.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            // Реагирует на ЛЮБОЙ подарок или команду из TikFinity
            if (data.event === "gift" || data.name === "SPIN_WHEEL" || data.event === "SPIN_WHEEL") {
              const sender = (data.data && (data.data.nickname || data.data.uniqueId)) || data.nickname || data.uniqueId || null;
              const gift = (data.data && data.data.giftName) || data.giftName || "Подарок TikFinity";
              spinWheel(null, sender ? { sender, gift } : null);
              return;
            }

            // Реагирует на команду !spin в чате TikFinity
            const rawComment = (data.comment || data.text || (data.data && (data.data.comment || data.data.text)) || "").trim().toLowerCase();
            if (
              data.event === "chat" ||
              data.event === "comment" ||
              data.name === "chat" ||
              rawComment.includes("!spin") ||
              rawComment.includes("!рулетка")
            ) {
              if (
                rawComment === "!spin" ||
                rawComment.startsWith("!spin ") ||
                rawComment === "!рулетка" ||
                rawComment.startsWith("!рулетка ")
              ) {
                const sender = (data.data && (data.data.nickname || data.data.uniqueId)) || data.nickname || data.uniqueId || "Чат";
                spinWheel(null, { sender, gift: "Команда: " + rawComment });
                return;
              }
            }
          } catch (err) {
            console.error(err);
            // Поддержка текстовых строковых команд
            if (event.data === "SPIN_WHEEL" || event.data === "spin" || event.data === "!spin") {
              spinWheel();
            }
          }
        };

        tfSocket.onclose = () => {
          if (wsDot) wsDot.classList.remove("connected");
          if (wsText) wsText.textContent = `TikFinity: Поиск (: ${CONFIG.wsPort || 21213})`;
          attemptReconnect();
        };

        tfSocket.onerror = (err) => {
          // Ошибка соединения (например, TikFinity еще не открыт)
          if (wsDot) wsDot.classList.remove("connected");
        };
      } catch (e) {
        attemptReconnect();
      }
    }

    function attemptReconnect() {
      if (!reconnectInterval) {
        reconnectInterval = setInterval(() => {
          if (!tfSocket || tfSocket.readyState === WebSocket.CLOSED) {
            initTikFinityWebSocket();
          }
        }, 3500);
      }
    }

    /**
     * =========================================================================
     * 7.5. ПОДКЛЮЧЕНИЕ К TIKTOK LIVE ЧЕРЕЗ СЕРВЕРНЫЙ SSE (/api/tiktok/events)
     * =========================================================================
     */
    let tiktokEventSource = null;
    function initTikTokSSE() {
      if (typeof window === "undefined" || !window.location.protocol.startsWith("http")) return;
      try {
        tiktokEventSource = new EventSource("/api/tiktok/events");

        tiktokEventSource.addEventListener("init", (e) => {
          try {
            const data = JSON.parse(e.data);
            if (data.connected && data.username) {
              wsDot.classList.add("connected");
              wsText.textContent = `TikTok LIVE: @${data.username}`;
            }
          } catch(err) {}
        });

        tiktokEventSource.addEventListener("connected", (e) => {
          try {
            const data = JSON.parse(e.data);
            wsDot.classList.add("connected");
            wsText.textContent = `TikTok LIVE: @${data.username}`;
          } catch(err) {}
        });

        tiktokEventSource.addEventListener("disconnected", () => {
          wsDot.classList.remove("connected");
          wsText.textContent = `TikTok: Отключен`;
        });

        tiktokEventSource.addEventListener("spin", (e) => {
          try {
            const data = JSON.parse(e.data);
            spinWheel(null, data.triggerInfo || null);
          } catch(err) {}
        });

        tiktokEventSource.addEventListener("gift", (e) => {
          try {
            const data = JSON.parse(e.data);
            console.log("[TikTok LIVE Event] Подарок:", data);
          } catch(err) {}
        });
      } catch (err) {
        console.log("[TikTok SSE] Режим автономного файла, используется TikFinity WebSocket");
      }
    }

    /**
     * =========================================================================
     * 8. УПРАВЛЕНИЕ: GALAXY TEST, POSTMESSAGE, ГОРЯЧИЕ КЛАВИШИ, ТЕСТОВАЯ ПАНЕЛЬ
     * =========================================================================
     */
    // 1. PostMessage для тестов из родительских окон / iframe
    window.addEventListener("message", (event) => {
      if (!event.data) return;
      if (event.data === "spin" || event.data.action === "spin") {
        const target = typeof event.data.targetIndex === "number" ? event.data.targetIndex : null;
        spinWheel(target, event.data.triggerInfo || null);
      }
    });

    // 2. Горячие клавиши для ручного теста стримером: Space или F8
    window.addEventListener("keydown", (e) => {
      // Игнорируем если фокус в input/textarea
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;

      if (e.code === "Space" || e.key === " " || e.key === "F8") {
        e.preventDefault();
        spinWheel();
      }
    });

    // 3. Обработчики кнопок тестовой панели
    const btnSpinRandom = document.getElementById("btn-spin-random");
    const btnSpinGalaxy = document.getElementById("btn-spin-galaxy");
    const btnSoundToggle = document.getElementById("btn-sound-toggle");
    const soundIcon = document.getElementById("sound-icon");
    const btnHideUi = document.getElementById("btn-hide-ui");
    const togglePanelBtn = document.getElementById("toggle-panel-btn");
    const testPanel = document.getElementById("test-controls-panel");

    btnSpinRandom.addEventListener("click", () => {
      spinWheel();
    });

    btnSpinGalaxy.addEventListener("click", () => {
      // Эмуляция подарка Галактика
      handleTikFinityMessage({
        event: "gift",
        data: {
          giftName: "Galaxy",
          giftId: 5655,
          nickname: "TikTok_Fan",
          repeatCount: 1
        }
      });
    });

    btnSoundToggle.addEventListener("click", () => {
      sound.enabled = !sound.enabled;
      soundIcon.textContent = sound.enabled ? "🔊" : "🔇";
      btnSoundToggle.title = sound.enabled ? "Звук включен" : "Звук выключен";
    });

    btnHideUi.addEventListener("click", () => {
      testPanel.classList.add("hidden");
    });

    togglePanelBtn.addEventListener("click", () => {
      testPanel.classList.toggle("hidden");
    });

    // Если в URL передан ?overlay=true, сразу скрываем тестовую панель
    if (CONFIG.overlayMode) {
      testPanel.classList.add("hidden");
    }

    /**
     * =========================================================================
     * 9. ИНИЦИАЛИЗАЦИЯ И ПЕРВАЯ ОТРИСОВКА
     * =========================================================================
     */
    drawWheel(currentRotation);
    initTikTokSSE();
    initTikFinityWebSocket();

    // Разрешаем AudioContext по любому клику пользователя на странице
    window.addEventListener("click", () => sound.initContext(), { once: true });
    window.addEventListener("keydown", () => sound.initContext(), { once: true });

    // Экспорт глобальной функции для вызова из консоли OBS
    window.spinWheel = spinWheel;
    window.SECTORS = SECTORS;
  </script>
</body>
