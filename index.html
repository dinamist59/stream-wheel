    <meta property="og:title" content="Рулетка для стрима (TikFinity & OBS)" />
    <meta property="og:description" content="Интерактивный неоновый оверлей Колесо фортуны для стримов TikTok Live Studio и OBS с прямым подключением к эфиру TikTok, поддержкой подарков (Галактика), чат-команд, TikFinity WebSocket и звуками Web Audio API." />

    <script>
      // Защитный перехватчик дескриптора fetch для предотвращения ошибок сторонних скриптов
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = originalFetch;
          var patchFetchOnTarget = function(target) {
            if (!target) return;
            try {
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (!desc || desc.configurable) {
                Object.defineProperty(target, 'fetch', {
                  get: function() { return activeFetch; },
                  set: function(newFetch) { activeFetch = typeof newFetch === 'function' ? newFetch : originalFetch; },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (err) {}
          };
          patchFetchOnTarget(window);
          if (typeof Window !== 'undefined' && Window.prototype) patchFetchOnTarget(Window.prototype);
          if (typeof globalThis !== 'undefined' && globalThis !== window) patchFetchOnTarget(globalThis);
          window.addEventListener('error', function(event) {
            var msg = (event && (event.message || (event.error && event.error.message))) || '';
            if (typeof msg === 'string' && msg.indexOf('fetch') !== -1 && (msg.indexOf('only a getter') !== -1 || msg.indexOf('Cannot set property') !== -1)) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }, true);
        } catch (e) {}
      })();
    </script>
