<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рулетка для стрима TikTok Live</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #wheel-container {
      position: relative;
      width: 500px;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #wheel-canvas {
      width: 480px;
      height: 480px;
      filter: drop-shadow(0 0 20px rgba(0,0,0,0.6));
    }
    #pointer {
      position: absolute;
      top: 0px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 46px;
      z-index: 10;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }
    #center-hub {
      position: absolute;
      width: 70px;
      height: 70px;
      background: radial-gradient(circle, #ffeaa7 0%, #d63031 100%);
      border: 4px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 20px;
      pointer-events: none;
    }
    #status-bar {
      margin-top: 15px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e74c3c;
    }
    .dot.connected {
      background: #2ecc71;
    }
    #controls {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    .btn {
      background: #e67e22;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    .btn:hover {
      background: #d35400;
    }
    /* Режим оверлея: прячем статус и кнопки при добавлении ?overlay=true */
    body.overlay-mode #status-bar,
    body.overlay-mode #controls {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="wheel-container">
    <svg id="pointer" viewBox="0 0 40 50">
      <path d="M 20 50 L 5 10 A 15 15 0 0 1 35 10 Z" fill="#ff7675" stroke="#ffffff" stroke-width="3" />
    </svg>
    <canvas id="wheel-canvas" width="800" height="800"></canvas>
    <div id="center-hub">★</div>
  </div>

  <div id="status-bar">
    <div class="dot" id="ws-dot"></div>
    <span id="ws-text">TikFinity: Поиск (:21213)</span>
  </div>

  <div id="controls">
    <button class="btn" id="btn-spin" onclick="spinWheel()">Крутить (Тест)</button>
  </div>

  <script>
    // Проверка режима оверлея в URL (?overlay=true)
    if (window.location.search.includes('overlay=true')) {
      document.body.classList.add('overlay-mode');
    }

    // 10 секторов
    const sectors = [
      { label: "-30 МИНУТ", color: "#e74c3c", timerDelta: -1800 },
      { label: "+20 МИНУТ", color: "#2ecc71", timerDelta: 1200 },
      { label: "20 ОТЖИМАНИЙ", color: "#3498db", timerDelta: 0 },
      { label: "-1 ЧАС (ДЖЕКПОТ)", color: "#f39c12", timerDelta: -3600 },
      { label: "+15 МИНУТ", color: "#27ae60", timerDelta: 900 },
      { label: "ПЛАНКА 1 МИН", color: "#9b59b6", timerDelta: 0 },
      { label: "-10 МИНУТ", color: "#d35400", timerDelta: -600 },
      { label: "+30 МИНУТ", color: "#1abc9c", timerDelta: 1800 },
      { label: "30 ПРИСЕДАНИЙ", color: "#34495e", timerDelta: 0 },
      { label: "-20 МИНУТ", color: "#c0392b", timerDelta: -1200 }
    ];

    const canvas = document.getElementById("wheel-canvas");
    const ctx = canvas.getContext("2d");
    const totalSectors = sectors.length;
    const arc = (2 * Math.PI) / totalSectors;
    let currentAngle = 0;
    let isSpinning = false;

    // Синтез звука тика трещотки (без MP3 файлов)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playClickSound() {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
      } catch (e) {}
    }

    function drawWheel() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2 - 20;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < totalSectors; i++) {
        const angle = currentAngle + i * arc;
        ctx.beginPath();
        ctx.fillStyle = sectors[i].color;
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle, angle + arc);
        ctx.lineTo(centerX, centerY);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = "rgba(255,255,255,0.4)";
        ctx.lineWidth = 3;

        // Текст сектора
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 26px sans-serif";
        ctx.shadowColor = "rgba(0,0,0,0.8)";
        ctx.shadowBlur = 6;
        ctx.fillText(sectors[i].label, radius - 35, 10);
        ctx.restore();
      }
    }

    drawWheel();

    // Запуск вращения
    let lastTickSector = -1;
    function spinWheel() {
      if (isSpinning) return;
      isSpinning = true;

      const fullSpins = 5 + Math.floor(Math.random() * 4); // 5-8 полных оборотов
      const stopAngle = Math.random() * 2 * Math.PI;
      const totalRotation = fullSpins * 2 * Math.PI + stopAngle;
      const startAngle = currentAngle;
      const duration = 6500; // 6.5 секунд вращения
      const startTime = performance.now();

      function animate(time) {
        const elapsed = time - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // Плавное замедление (ease-out-cubic)
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = startAngle + totalRotation * easeOut;
        drawWheel();

        // Проверка тика трещотки
        const pointerAngle = (3 * Math.PI / 2 - (currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        const currentSectorIdx = Math.floor(pointerAngle / arc);
        if (currentSectorIdx !== lastTickSector) {
          playClickSound();
          lastTickSector = currentSectorIdx;
        }

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          // Определение победившего сектора
          const winningSector = sectors[currentSectorIdx];
          console.log("Выпало:", winningSector.label);

          // Отправка команды в TikFinity (если привязан таймер)
          if (ws && ws.readyState === WebSocket.OPEN && winningSector.timerDelta !== 0) {
            ws.send(JSON.stringify({
              action: "adjustTimer",
              seconds: winningSector.timerDelta
            }));
          }
        }
      }

      requestAnimationFrame(animate);
    }

    // Слушатель пробела
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.key === " ") {
        spinWheel();
      }
    });

    // Связь с WebSocket TikFinity
    let ws = null;
    function initWebSocket() {
      const dot = document.getElementById("ws-dot");
      const text = document.getElementById("ws-text");

      try {
        ws = new WebSocket("ws://localhost:21213/");

        ws.onopen = () => {
          dot.classList.add("connected");
          text.innerText = "TikFinity: Подключено";
        };

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            const giftName = data?.data?.giftName || data?.data?.gift?.name || data?.data?.name || data?.name || "";
            const eventName = data?.event || "";

            // Проверяем Галактику (ENG/RU) или команду SPIN_WHEEL
            const isGalaxy = giftName.toLowerCase().includes("galax") || giftName.toLowerCase().includes("галакт");
            const isSpinTrigger = eventName === "SPIN_WHEEL" || giftName === "SPIN_WHEEL";

            if (isGalaxy || isSpinTrigger) {
              spinWheel();
            }
          } catch (err) {}
        };

        ws.onclose = () => {
          dot.classList.remove("connected");
          text.innerText = "TikFinity: Отключен (Повтор...)";
          setTimeout(initWebSocket, 3000);
        };

        ws.onerror = () => {
          ws.close();
        };
      } catch (err) {
        setTimeout(initWebSocket, 3000);
      }
    }

    initWebSocket();
  </script>
</body>
</html>
